# 构建与发布：web/dist 内嵌 + 多平台二进制 + Release
name: Build & Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install root deps (yaml)
        run: bun install --frozen-lockfile

      - name: Build frontend
        run: |
          cd web
          bun install
          bunx vite build

      - name: Embed assets into bundle
        run: bun scripts/embed.mjs

      - name: Compile multi-platform binaries
        run: |
          mkdir -p dist-bin
          bun build --compile server.ts --outfile dist-bin/omp-switch-darwin-arm64 --target bun-darwin-arm64
          bun build --compile server.ts --outfile dist-bin/omp-switch-darwin-x64 --target bun-darwin-x64
          bun build --compile server.ts --outfile dist-bin/omp-switch-linux-x64 --target bun-linux-x64
          bun build --compile server.ts --outfile dist-bin/omp-switch-linux-arm64 --target bun-linux-arm64
          bun build --compile server.ts --outfile dist-bin/omp-switch-windows-x64.exe --target bun-windows-x64

      - uses: actions/upload-artifact@v4
        with:
          name: omp-switch-binaries
          path: dist-bin/

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-bin/*
          generate_release_notes: true
