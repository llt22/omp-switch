name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          cd web
          bun install --frozen-lockfile

      - name: Check frontend
        run: |
          cd web
          bun run typecheck
          bun run build

      - name: Embed frontend
        run: bun scripts/embed.mjs

      - name: Test backend
        run: bun test

      - name: Compile backend sidecar
        run: |
          mkdir -p tauri/binaries
          bun build --compile server.ts --target bun-linux-x64 --outfile tauri/binaries/omp-switch-server-x86_64-unknown-linux-gnu

      - name: Check desktop app
        run: cargo check --locked --manifest-path tauri/Cargo.toml
